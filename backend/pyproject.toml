[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-inspector"
dynamic = ["version"]
description = "Static validator, LLM judge and trajectory profiler for agent skills (SKILL.md)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Aditya Kumar"}]
keywords = ["agent-skills", "claude", "llm", "linter", "validation"]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
]

[project.scripts]
skill-inspector = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.urls]
Homepage = "https://github.com/neo7337/skill_inspector"
Issues = "https://github.com/neo7337/skill_inspector/issues"

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}
