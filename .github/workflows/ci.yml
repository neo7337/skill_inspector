name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_backend:
        description: 'Publish Backend Docker image to GHCR'
        type: boolean
        default: false
      publish_frontend:
        description: 'Publish Frontend Docker image to GHCR'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # STEP 1: Static Checks (Backend & Frontend in parallel)
  # ===========================================================================
  step1-backend-static-checks:
    name: "Step 1: Backend Static Checks (Ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff critical error checks
        run: |
          # Fail on critical syntax errors, undefined variables, and fatal errors
          ruff check backend/ --select E9,F63,F7,F82

      - name: Run Ruff style check
        run: |
          # Informational code style scan
          ruff check backend/ || true

  step1-frontend-static-checks:
    name: "Step 1: Frontend Static Checks (Oxlint & TypeScript)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: npx tsc -b

  # ===========================================================================
  # STEP 2: Running Tests (Depends on Step 1)
  # ===========================================================================
  step2-tests:
    name: "Step 2: Run Tests (Pytest + Coverage)"
    runs-on: ubuntu-latest
    needs: [step1-backend-static-checks, step1-frontend-static-checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Pytest test suite
        run: |
          cd backend
          PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # STEP 3: Building Backend & Frontend in parallel (Depends on Step 2)
  # ===========================================================================
  step3-build-backend:
    name: "Step 3: Build Backend Package (Wheel/sdist)"
    runs-on: ubuntu-latest
    needs: [step2-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python distribution package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload backend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package-dist
          path: dist/
          retention-days: 7

  step3-build-frontend:
    name: "Step 3: Build Frontend (Vite production bundle)"
    runs-on: ubuntu-latest
    needs: [step2-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

